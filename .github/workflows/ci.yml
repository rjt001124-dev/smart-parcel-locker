name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Go formatting
        run: test -z "$(gofmt -l app api internal tests)"

      - name: Verify Go code
        run: |
          go mod verify
          go vet ./...
          go test -race -coverprofile=coverage.out ./...

      - name: Start isolated MySQL and Redis
        run: |
          docker compose -f deploy/docker-compose.yml up -d mysql redis
          for attempt in $(seq 1 60); do
            mysql_status=$(docker inspect --format='{{.State.Health.Status}}' deploy-mysql-1 2>/dev/null || true)
            redis_status=$(docker inspect --format='{{.State.Health.Status}}' deploy-redis-1 2>/dev/null || true)
            if [ "$mysql_status" = healthy ] && [ "$redis_status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml ps
          exit 1

      - name: Verify migrations and integration flow
        env:
          APP_ENV: test
          CONFIRM_LOCAL_RESET: reset-local
          TEST_BASE_URL: http://127.0.0.1:8000
          TEST_INTERNAL_TOKEN: change-this-local-token
        run: |
          make migrate-up
          make migrate-cycle
          docker compose -f deploy/docker-compose.yml up -d --build api worker
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/readyz
          go test -tags=integration -race ./tests/integration
          make migrate-cycle

      - name: Verify project rules and Skills
        run: |
          python scripts/test_agents_rules.py
          python scripts/test_validate_skills.py
          python scripts/validate_skills.py

      - name: Build application images
        run: |
          docker build -f deploy/Dockerfile.api -t smart-parcel-locker-api:ci .
          docker build -f deploy/Dockerfile.worker -t smart-parcel-locker-worker:ci .

      - name: Show compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
