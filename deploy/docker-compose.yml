services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_parcel_locker}
      MYSQL_USER: ${MYSQL_USER:-locker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-this-local-password}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-change-this-local-password}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: local
    environment:
      APP_ENV: development
      HTTP_ADDR: 0.0.0.0:8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_parcel_locker}
      MYSQL_USER: ${MYSQL_USER:-locker}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-this-local-password}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-this-local-token}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  mysql_data:
  redis_data:
