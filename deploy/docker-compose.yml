services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        VERSION: local
    environment:
      HTTP_ADDR: "0.0.0.0:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
