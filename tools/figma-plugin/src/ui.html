<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:13px Inter,Arial;color:#101828;background:#f7f9fc}main{padding:20px}h1{font-size:20px;margin:0 0 8px}.sub{color:#667085;line-height:1.5}.file{margin:16px 0;padding:12px;background:#fff;border:1px solid #d0d5dd;border-radius:8px;word-break:break-all}.confirm{display:flex;gap:8px;align-items:flex-start;margin:12px 0 16px}.stages{display:grid;gap:10px}.stage{width:100%;padding:12px;text-align:left;border:1px solid #bae0ff;background:#fff;color:#0958d9;border-radius:8px;font-weight:600;cursor:pointer}.stage:disabled{opacity:.45;cursor:not-allowed}.status{margin-top:16px;padding:12px;background:#101828;color:#fff;border-radius:8px;min-height:110px;white-space:pre-wrap;overflow:auto}.footer{display:flex;justify-content:flex-end;margin-top:16px}.close{border:0;background:transparent;color:#667085;cursor:pointer}
</style></head><body><main><h1>智能快递柜设计生成器</h1><div class="sub">按顺序运行四个阶段；重复运行会更新插件拥有的资源。</div><div class="file">当前文件：<strong id="file">正在读取…</strong></div><label class="confirm"><input id="confirm" type="checkbox"><span>我确认当前是智能快递柜设计文件</span></label><div class="stages"><button class="stage" data-stage="foundations" disabled>1. 生成 Foundations</button><button class="stage" data-stage="components" disabled>2. 生成 Components</button><button class="stage" data-stage="mini-app" disabled>3. 生成 Mini App</button><button class="stage" data-stage="admin-web" disabled>4. 生成 Admin Web</button></div><div id="status" class="status">等待操作</div><div class="footer"><button id="close" class="close">关闭插件</button></div></main><script>
const confirmBox=document.getElementById('confirm'),buttons=[...document.querySelectorAll('.stage')],status=document.getElementById('status');
confirmBox.onchange=()=>buttons.forEach(b=>b.disabled=!confirmBox.checked);
buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.disabled=true);parent.postMessage({pluginMessage:{type:'run-stage',stage:b.dataset.stage,confirmed:confirmBox.checked}},'*')});
document.getElementById('close').onclick=()=>parent.postMessage({pluginMessage:{type:'close-plugin'}},'*');
onmessage=event=>{const m=event.data.pluginMessage;if(!m)return;if(m.type==='ready')document.getElementById('file').textContent=m.fileName;if(m.type==='running')status.textContent='正在运行：'+m.stage;if(m.type==='result'){status.textContent=JSON.stringify(m.report,null,2);buttons.forEach(b=>b.disabled=!confirmBox.checked)}};
</script></body></html>
